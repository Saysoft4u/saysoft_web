<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- تدرجات لونية طبية حديثة وعالية التقنية -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- فلتر الظلال الناعمة -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- خلفية الأيقونة المربعة بزوايا دائرية فخمة -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- إطار خارجي رفيع مضيء -->
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" />

  <!-- دوائر وخيوط ضوئية تقنية خلفية خافتة -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />

  <!-- الدرع الطبي المركزي فائق النقاء -->
  <g filter="url(#dropShadow)">
    <path d="M 256 95 
             C 345 95 385 130 385 220 
             C 385 320 290 385 256 415 
             C 222 385 127 320 127 220 
             C 127 130 167 95 256 95 Z" 
          fill="url(#shieldGrad)" />
  </g>

  <!-- إطار الدرع الناعم الداخلي -->
  <path d="M 256 108 
           C 335 108 372 138 372 220 
           C 372 310 286 370 256 398 
           C 226 370 140 310 140 220 
           C 140 138 177 108 256 108 Z" 
        fill="none" stroke="#e0f2fe" stroke-width="3" />

  <!-- الصليب الطبي الحديث المنساب بأطراف دائرية مريحة -->
  <g>
    <!-- الضلع الرأسي -->
    <rect x="230" y="160" width="52" height="155" rx="22" fill="url(#crossGrad)" />
    <!-- الضلع الأفقي -->
    <rect x="178" y="211" width="156" height="53" rx="22" fill="url(#crossGrad)" />
  </g>

  <!-- نبض القلب التفاعلي الحديث (ECG Pulse Line) متداخل مع الصليب -->
  <path d="M 160 237.5 
           L 205 237.5 
           L 222 185 
           L 245 285 
           L 268 205 
           L 285 255 
           L 302 237.5 
           L 352 237.5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glowEffect)" />

  <!-- نقاط تقنية ونبضات دائرية على خط النبض -->
  <circle cx="245" cy="285" r="5" fill="#10b981" />
  <circle cx="268" cy="205" r="5" fill="#38bdf8" />

  <!-- أيقونة الهلال / الرعاية الحاضنة في الأسفل -->
  <path d="M 215 330 C 235 345 277 345 297 330" 
        fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
</svg>
