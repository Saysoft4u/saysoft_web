<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad4)" />

  <rect x="0" y="0" width="1200" height="70" fill="#0b1120" />
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#334155" stroke-width="1" />
  <text x="1160" y="44" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="end">⚖️ ساي ليجال | الحسابات المالية وأتعاب المحاماة</text>
  <text x="50" y="44" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="start">الإدارة المالية > مطالبات الأتعاب وسندات التحصيل</text>

  <!-- القائمة الجانبية -->
  <rect x="980" y="70" width="220" height="680" fill="#0f172a" />
  <line x1="980" y1="70" x2="980" y2="750" stroke="#334155" stroke-width="1" />
  <rect x="995" y="286" width="190" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="1165" y="313" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end">💰 أتعاب ومحاسبة القضايا</text>

  <!-- مؤشرات مالية سريعة -->
  <g transform="translate(40, 95)">
    <rect x="620" y="0" width="300" height="95" rx="10" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1" />
    <text x="890" y="30" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">إجمالي المطالبات الصادرة</text>
    <text x="890" y="68" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="end">1,840,000 ر.س</text>

    <rect x="310" y="0" width="295" height="95" rx="10" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1" />
    <text x="580" y="30" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">المبالغ المحصلة فعلياً</text>
    <text x="580" y="68" fill="#4ade80" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="end">1,420,000 ر.س</text>

    <rect x="0" y="0" width="295" height="95" rx="10" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1" />
    <text x="270" y="30" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">المتبقيات قيد السداد</text>
    <text x="270" y="68" fill="#f59e0b" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="end">420,000 ر.س</text>
  </g>

  <!-- جدول سندات وفواتير الأتعاب -->
  <g transform="translate(40, 215)">
    <rect x="0" y="0" width="920" height="490" rx="14" fill="#131c2e" stroke="#334155" stroke-width="1" />
    <text x="890" y="40" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="end">🧾 سجل الفواتير الضريبية ومطالبات الأتعاب (متوافق مع هيئة الزكاة والضريبة)</text>

    <!-- ترويسة الجدول -->
    <rect x="20" y="70" width="880" height="40" rx="6" fill="#1e293b" />
    <text x="870" y="95" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">رقم الفاتورة</text>
    <text x="730" y="95" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">الموكل / العميل</text>
    <text x="560" y="95" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">القضية المرتبطة</text>
    <text x="400" y="95" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">قيمة المطالبة</text>
    <text x="250" y="95" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">حالة السداد</text>
    <text x="90" y="95" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="center">إيصال إلكتروني</text>

    <!-- سطر 1 -->
    <line x1="20" y1="160" x2="900" y2="160" stroke="#1e293b" stroke-width="1" />
    <text x="870" y="140" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">INV-2026/089</text>
    <text x="730" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">شركة أفق للاستثمار العقاري</text>
    <text x="560" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">ق-2026/4102</text>
    <text x="400" y="140" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="end">120,000 ر.س</text>
    <rect x="220" y="122" width="65" height="26" rx="4" fill="#065f46" />
    <text x="252" y="139" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">مسدد بالكامل</text>
    <text x="90" y="140" fill="#38bdf8" font-family="sans-serif" font-size="13" text-anchor="middle">🖨️ طباعة فاتورة</text>

    <!-- سطر 2 -->
    <line x1="20" y1="210" x2="900" y2="210" stroke="#1e293b" stroke-width="1" />
    <text x="870" y="190" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">INV-2026/090</text>
    <text x="730" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">مجموعة الفرسان الدولية</text>
    <text x="560" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">ع-2026/1890</text>
    <text x="400" y="190" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="end">65,000 ر.س</text>
    <rect x="220" y="172" width="65" height="26" rx="4" fill="#78350f" />
    <text x="252" y="189" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">دفعة جزئية</text>
    <text x="90" y="190" fill="#38bdf8" font-family="sans-serif" font-size="13" text-anchor="middle">🖨️ طباعة فاتورة</text>
  </g>
</svg>
