  <text x="540" y="415" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">مجموعة الفرسان الدولية</text>
  <text x="360" y="415" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="end">الأحد القادم - 11:00 صباحاً</text>
  <text x="180" y="415" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">أ. فهد الشمري</text>
  <rect x="70" y="398" width="55" height="24" rx="4" fill="#1e3a8a" />
  <text x="97" y="414" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">مرافعة</text>

  <!-- سطر 3 -->
  <line x1="60" y1="485" x2="940" y2="485" stroke="#1e293b" stroke-width="1" />
  <text x="910" y="465" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">ت-2026/894</text>
  <text x="760" y="465" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">المحكمة التجارية - الدائرة التاسعة</text>
  <text x="540" y="465" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">مؤسسة التشييد والبناء</text>
  <text x="360" y="465" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="end">الثلاثاء - 10:15 صباحاً</text>
  <text x="180" y="465" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">أ. عبد الرحمن السعيد</text>
  <rect x="70" y="448" width="55" height="24" rx="4" fill="#78350f" />
  <text x="97" y="464" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">تقديم مذكرة</text>

  <!-- سطر 4 -->
  <line x1="60" y1="535" x2="940" y2="535" stroke="#1e293b" stroke-width="1" />
  <text x="910" y="515" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">ق-2026/3041</text>
  <text x="760" y="515" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">محكمة الاستئناف الإدارية</text>
  <text x="540" y="515" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="end">د. خالد المطيري</text>
  <text x="360" y="515" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="end">الخميس - 12:30 ظهراً</text>
  <text x="180" y="515" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">أ. سارة المنصور</text>
  <rect x="70" y="498" width="55" height="24" rx="4" fill="#14532d" />
  <text x="97" y="514" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">دراسة قرار</text>
</svg>
