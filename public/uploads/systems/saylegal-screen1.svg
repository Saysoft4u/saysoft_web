<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- خلفية النظام العامة -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- الشريط العلوي Topbar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0b1120" />
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#334155" stroke-width="1" />
  <text x="1160" y="44" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="end">⚖️ منظومة ساي ليجال | إدارة مكاتب المحاماة</text>
  <text x="50" y="44" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="start">المحامي: أ. عبد الرحمن السعيد (شريك رئيسي) | فرع الرياض</text>

  <!-- القائمة الجانبية Sidebar -->
  <rect x="980" y="70" width="220" height="680" fill="#0f172a" />
  <line x1="980" y1="70" x2="980" y2="750" stroke="#334155" stroke-width="1" />

  <!-- عناصر القائمة الجانبية -->
  <rect x="995" y="90" width="190" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="1165" y="117" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end">📊 لوحة المؤشرات القضائية</text>

  <rect x="995" y="142" width="190" height="38" rx="8" fill="transparent" />
  <text x="1165" y="166" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="end">📁 سجل القضايا والدعاوى</text>

  <rect x="995" y="190" width="190" height="38" rx="8" fill="transparent" />
  <text x="1165" y="214" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="end">📅 أجندة مواعيد الجلسات</text>

  <rect x="995" y="238" width="190" height="38" rx="8" fill="transparent" />
  <text x="1165" y="262" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="end">📜 إدارة العقود والتوكيلات</text>

  <rect x="995" y="286" width="190" height="38" rx="8" fill="transparent" />
  <text x="1165" y="310" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="end">💰 أتعاب ومحاسبة القضايا</text>

  <rect x="995" y="334" width="190" height="38" rx="8" fill="transparent" />
