    <text x="430" y="32" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">التوكيلات السارية</text>
    <text x="430" y="75" fill="#4ade80" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="end">312</text>
    <text x="430" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="end">موثقة إلكترونياً ناجز</text>

