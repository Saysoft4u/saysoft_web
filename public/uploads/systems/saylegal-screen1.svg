    <rect x="5" y="0" width="210" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="195" y="32" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">نسبة الأحكام الإيجابية</text>
    <text x="195" y="75" fill="#a855f7" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="end">94.2%</text>
    <text x="195" y="98" fill="#c084fc" font-family="sans-serif" font-size="11" text-anchor="end">بناءً على 84 حكم قطعي</text>
