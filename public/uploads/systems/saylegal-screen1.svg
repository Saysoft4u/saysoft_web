  <text x="360" y="365" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">غداً - 09:30 صباحاً</text>
  <text x="180" y="365" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">أ. عبد الرحمن السعيد</text>
