  <!-- منطقة المحتوى الرئيسية -->
  <!-- بطاقات الإحصائيات العلوية KPI Cards -->
  <g transform="translate(40, 95)">
    <!-- كارت 1 -->
    <rect x="710" y="0" width="210" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="900" y="32" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">إجمالي القضايا النشطة</text>
    <text x="900" y="75" fill="#38bdf8" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="end">148</text>
    <text x="900" y="98" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="end">▲ 12 قضية جديدة هذا الشهر</text>

    <!-- كارت 2 -->
    <rect x="475" y="0" width="210" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="665" y="32" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">جلسات المحاكم هذا الأسبوع</text>
    <text x="665" y="75" fill="#f59e0b" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="end">19</text>
    <text x="665" y="98" fill="#fcd34d" font-family="sans-serif" font-size="11" text-anchor="end">● 4 جلسات حاسمة غداً</text>

