      <text x="485" y="27" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">مكتمل ومعتمد</text>
      <text x="320" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">اليوم 04:00 مساءً</text>
      <text x="150" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa" text-anchor="middle">الإدارة العامة للعقود</text>
      <circle cx="50" cy="24" r="12" fill="#0284c7" fill-opacity="0.3"/>
      <text x="50" y="28" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">👁️</text>
