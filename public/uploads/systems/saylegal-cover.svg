    <!-- شريط سفلي توضيحي مميز للمنظومة -->
    <g transform="translate(20, 248)">
      <rect width="1080" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="1060" y="22" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="end">🔒 نظام مشفر بالكامل ببروتوكول AES-256 لحماية خصوصية وسرية ملفات الموكلين والقضايا الحساسة</text>
