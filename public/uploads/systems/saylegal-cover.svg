    <!-- ميزان العدالة والأيقونة الذهبية -->
    <circle cx="1115" cy="65" r="22" fill="#d97706" fill-opacity="0.2"/>
    <g transform="translate(1103, 53) scale(0.9)" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v18M3 9l9-4 9 4M3 9l4 7h-8zM21 9l4 7h-8z"/>
    </g>

    <text x="1075" y="71" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="end">منظومة ساي ليجل السحابية | SayLegal Law Platform</text>
    
    <!-- شارة الإصدار المعتمد -->
