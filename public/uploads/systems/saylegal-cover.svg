      <circle cx="50" cy="24" r="12" fill="#0284c7" fill-opacity="0.3"/>
      <text x="50" y="28" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">👁️</text>
    </g>

    <!-- صف جدول 2 -->
    <g transform="translate(20, 130)">
      <rect width="1080" height="48" rx="8" fill="#1e293b" fill-opacity="0.3"/>
      <text x="1050" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="end">دعوى رقم 1209 / عمالي كلي</text>
      <text x="750" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="end">مستحقات وتعويض عقود عمل تنفيذية</text>
      <rect x="430" y="10" width="110" height="26" rx="13" fill="#d97706" fill-opacity="0.25"/>
      <text x="485" y="27" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">إيداع مذكرة دفاع</text>
      <text x="320" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">الأربعاء 11:00 صباحاً</text>
      <text x="150" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">محكمة شمال الابتدائية</text>
      <circle cx="50" cy="24" r="12" fill="#0284c7" fill-opacity="0.3"/>
      <text x="50" y="28" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">👁️</text>
    </g>

    <!-- صف جدول 3 -->
    <g transform="translate(20, 185)">
      <rect width="1080" height="48" rx="8" fill="#1e293b" fill-opacity="0.5"/>
      <text x="1050" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="end">عقد اندماج واستحواذ رقم M&amp;A-240</text>
